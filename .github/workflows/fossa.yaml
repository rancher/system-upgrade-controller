name: FOSSA Scanning

on:
  push:
    branches: [ "master" ]
  # For manual scans.
  workflow_dispatch:

permissions:
  # Basic read access needed.
  contents: read
  # Required to authenticate in EIO's Vault.
  id-token: write

jobs:
  fossa-scanning:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Read FOSSA token
      uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
      with:
        secrets: |
          secret/data/github/org/rancher/fossa/push token | FOSSA_API_KEY_PUSH_ONLY

    - name: FOSSA scan
      uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
      with:
        api-key: ${{ env.FOSSA_API_KEY_PUSH_ONLY }}
        # Only runs the scan and do not provide/return any results back to the
        # pipeline.
        run-tests: false
