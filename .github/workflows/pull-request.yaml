name: CI on Pull Request

# The jobs below will execute any time a PR is created.
on: 
  pull_request:
  push:
    branches:
      - 'master'

jobs:
  # Runs build, test, package, and e2e checks.
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        os: [linux]
        arch: [amd64, arm64, arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Install CI tools
        run: bash ./scripts/install-ci-tools

      - name: Run CI
        run: make ci ARCH=${{ matrix.arch }}
      
      - name: Run e2e
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          make e2e-sonobuoy ARCH=${{ matrix.arch }}
          make e2e-verify ARCH=${{ matrix.arch }}
